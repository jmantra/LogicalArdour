[package]
name = "key"
version = "0.1.0"
edition = "2021"
description = "Estimate the musical key of an audio file"

[dependencies]
realfft = "3"
rubato = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "aiff", "flac", "mp3", "ogg", "pcm", "vorbis", "alac", "aac", "isomp4", "caf"] }
